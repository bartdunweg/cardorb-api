"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm ci"
# Concurrent, because a workspace here needs nothing but a port: no database, no
# Docker, no fixed listener. Two of them can run side by side, which is the
# whole reason for having workspaces.
run_mode = "concurrent"

[scripts.run.dev]
# CONDUCTOR_PORT only exists on the Mac, so a cloud workspace must not offer
# this: it would start on 3000 and collide with itself.
available_in = [ "local" ]
command = "npm run dev -- --port $CONDUCTOR_PORT"
default = true
icon = "play"

[scripts.run.check]
command = "npm run check"
icon = "circle-check"
