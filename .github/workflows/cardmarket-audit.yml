# Is every Cardmarket link still pointing at the card it names?
#
# Apart from check.yml because it is the one check that goes on the network: it reads
# Cardmarket's 13MB product catalogue, which a test may not do and which has nothing to say
# about a pull request. What it catches is a link that was always wrong rather than one this
# change broke, so it runs on a clock, not on a push.
#
# Weekly, because the catalogue moves slowly and a wrong link is worth money rather than
# minutes: Venusaur EX XY28 read €116.93 off a Japanese card for months before anyone looked
# (#341). Monday morning, so a red run is seen at the start of a week rather than over one.
name: cardmarket audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Exits 1 on a link whose product sits outside its set's own Cardmarket expansion.
      # The list it prints is the work: each one is picked by hand, as #341 was.
      - run: node scripts/cardmarket-ids-fill.mjs --audit
