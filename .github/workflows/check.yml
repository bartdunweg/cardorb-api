# The gate npm run check was written to be and never had.
#
# Deploys go straight off a push to main, so until now nothing stood between a
# typecheck error and production except remembering to run the command. The
# build is in here as well as the tests for a specific reason: it is the only
# step that parses the CSS, and a broken selector has reached main that way
# before — tests and typecheck both passed, and the page 500'd on the stylesheet.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node the app is developed and deployed on.
          node-version: 20
          cache: npm

      - run: npm ci

      # typecheck, then the tests, then lint. The script already exists and is
      # what a person runs locally; running the same one here means the two
      # cannot drift.
      - run: npm run check

      # Needs no secrets: getCards() fails soft and returns an empty collection
      # without NOTION_TOKEN, which is enough to compile every route. The pages
      # that prerender card detail get an empty list and build zero of them.
      - run: npm run build
